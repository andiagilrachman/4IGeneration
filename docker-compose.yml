# ============================================================
# 4IGeneration — Docker Compose (Development)
#
# Default  : docker compose up -d          → MySQL + Redis saja
# Full stack: docker compose --profile apps up -d  → semua app juga
# ============================================================
name: 4igeneration

services:
  # ---------- Infrastructure ----------
  mysql:
    image: mysql:8.0
    container_name: 4ig-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-4igeneration}
      MYSQL_USER: ${MYSQL_USER:-4ig}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-4ig_pass}
      TZ: ${TZ:-Asia/Makassar}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: 4ig-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-4ig_redis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-4ig_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Applications (profile: apps) ----------
  nginx:
    image: nginx:alpine
    container_name: 4ig-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - admin
      - ai-service
    profiles: ["apps"]

  web:
    build:
      context: ./apps/web
    container_name: 4ig-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    profiles: ["apps"]

  api:
    build:
      context: ./apps/api
    container_name: 4ig-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-4ig}:${MYSQL_PASSWORD:-4ig_pass}@mysql:3306/${MYSQL_DATABASE:-4igeneration}
      REDIS_URL: redis://:${REDIS_PASSWORD:-4ig_redis}@redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["apps"]

  admin:
    build:
      context: ./apps/admin
    container_name: 4ig-admin
    restart: unless-stopped
    ports:
      - "3002:80"
    profiles: ["apps"]

  ai-service:
    build:
      context: ./apps/ai-service
    container_name: 4ig-ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${NODE_ENV:-development}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "8000:8000"
    profiles: ["apps"]

volumes:
  mysql_data:
  redis_data:
