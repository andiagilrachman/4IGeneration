# 4IGeneration — CI/CD (GitHub Actions)
# Referensi blueprint BAGIAN 13 (CI/CD Pipeline)
#
# Catatan: jalankan `pnpm install` di lokal dulu agar
# pnpm-lock.yaml ter-commit, lalu ubah ke --frozen-lockfile.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prisma generate
        run: pnpm --filter @4ig/api prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
