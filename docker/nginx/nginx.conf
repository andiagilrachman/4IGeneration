# 4IGeneration — Nginx reverse proxy (development, single host)
events {}

http {
  upstream web_upstream      { server web:3000; }
  upstream api_upstream      { server api:3001; }
  upstream admin_upstream    { server admin:80; }
  upstream ai_upstream       { server ai-service:8000; }

  server {
    listen 80;
    server_name _;

    # Web (Next.js)
    location / {
      proxy_pass http://web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (NestJS)
    location /api/ {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel (Refine)
    location /admin/ {
      proxy_pass http://admin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AI service (FastAPI) — internal, jangan expose ke publik di prod
    location /internal/ai/ {
      proxy_pass http://ai_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
